<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kredi Hesapla</title>
    <style>
        #form {
            width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
		  input[type="number"] {
       appearance: textfield; /* Other browsers */
  }
    </style>
</head>

<body>
    <div id="form">
        <h2>Kredi Hesapla</h2>
        <form>
            <label for="creditType">Kredi Türü:</label>
            <select id="creditType" name="creditType">
                <option value="konut">Konut Kredisi</option>
                <option value="tüketici">Tüketici Kredisi</option>
            </select>
            <br> <br> 
            <label for="principal">Anapara:</label>
            <input type="number" inputmode="decimal" id="principal" name="principal" required>
            <br> <br> 
            <label for="interestRate">Aylık Faiz Oranı (%):</label>
            <input type="number" inputmode="decimal" id="interestRate" name="interestRate" step="0.01" required>
            <br> <br> 
            <label for="term">Vade (ay):</label>
            <input type="number" inputmode="decimal" id="term" name="term" required>
            <br> <br> 
            <label for="fees">Masraf, Sigorta vb.:</label>
            <input type="number" inputmode="decimal" id="fees" name="fees" value="0" required>
            <br> <br> 
        </form>
        <br> 
        <div id="result6"></div>
        <b><div id="result"></div></b>
        <b><div id="result2"></div></b>
        <div id="result3"></div>
        <div id="result4"></div>
        <div id="result5"></div>
    </div>

    <script>
        // Add event listeners to input fields
        document.getElementById("creditType").addEventListener("change", calculatePMT);
        document.getElementById("principal").addEventListener("input", calculatePMT);
        document.getElementById("interestRate").addEventListener("input", calculatePMT);
        document.getElementById("term").addEventListener("input", calculatePMT);
        document.getElementById("fees").addEventListener("input", calculatePMT);

        // Calculate function
        function calculatePMT() {
            var creditType = document.getElementById("creditType").value;
            var principal = parseFloat(document.getElementById("principal").value);
            var interestRate = parseFloat(document.getElementById("interestRate").value);
            var term = parseFloat(document.getElementById("term").value);
            var fees = parseFloat(document.getElementById("fees").value);

            if (creditType === "tüketici") {
                interestRate *= 1.3; // Tüketici kredisi için faiz oranını 1.3 ile çarpar
            }

            var monthlyInterestRate = interestRate / 100;
            var monthlyPayment = -1 * PMT(monthlyInterestRate, term, principal, 0, 0);

            document.getElementById("result").innerHTML = "Aylık Ödeme: " + (monthlyPayment*-1).toLocaleString("tr-TR", {maximumFractionDigits:2});

            var eleGecen = principal - fees
            var rate = RATE(term, -monthlyPayment, eleGecen);
            var yillikOran = (Math.pow(1 + rate, 12)-1)*100
            document.getElementById("result2").innerHTML = "Faiz Oranı (Aylık): %" + (rate * 100).toLocaleString("tr-TR", {maximumFractionDigits:2});
            document.getElementById("result3").innerHTML = "Faiz Oranı (Yıllık): %" + yillikOran.toLocaleString("tr-TR", {maximumFractionDigits:2});

            document.getElementById("result4").innerHTML = "Ödenen Faiz Masraf Vergi: " + (term*monthlyPayment*-1-eleGecen).toLocaleString("tr-TR", {maximumFractionDigits:2});
            document.getElementById("result5").innerHTML = "Toplam Ödeme: " + (term*monthlyPayment*-1).toLocaleString("tr-TR", {maximumFractionDigits:2});
            document.getElementById("result6").innerHTML = "Ele Geçen Tutar: " + (eleGecen).toLocaleString("tr-TR", {maximumFractionDigits:2});
        }

        // PMT fonksiyonunu hesaplamak için
        function PMT(rate, nper, pv, fv, type) {
            if (!fv) fv = 0;
            if (!type) type = 0;

            var pmt = (rate * (pv * Math.pow(1 + rate, nper) + fv)) / ((1 + rate * type) * (Math.pow(1 + rate, nper) - 1));

            return pmt;
        }
        
        // RATE fonksiyonunu hesaplamak için
        function RATE(nper, pmt, pv, fv, type, guess) {
            if (!fv) fv = 0;
            if (!type) type = 0;
            if (!guess) guess = 0.1;

            var rate = Math.pow(1 + guess, nper) - 1;

            function calculatePMT(rate) {
                return (rate * (pv * Math.pow(1 + rate, nper) + fv)) / ((1 + rate * type) * (Math.pow(1 + rate, nper) - 1)) - pmt;
            }

            var rateGuess = guess;
            var rateNext = rateGuess;

            while (Math.abs(calculatePMT(rateNext)) > 0.000001) {
                rateGuess = rateNext;
                rateNext = rateGuess - calculatePMT(rateGuess) * ((rateGuess - rate) / (calculatePMT(rateGuess) - calculatePMT(rate)));
            }

            return rateNext;
        }
        
    </script>
</body>
</html>
